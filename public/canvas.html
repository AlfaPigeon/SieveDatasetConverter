<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sieve Canvas</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="canvas.css"></head>
<body class="cv">
<header class="bar">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><g fill="#0f1115"><circle cx="10" cy="11" r="2"/><circle cx="16" cy="11" r="2"/><circle cx="22" cy="11" r="2"/><circle cx="13" cy="17" r="2"/><circle cx="19" cy="17" r="2"/><circle cx="16" cy="23" r="2"/></g></svg>
  <b class="brand">Sieve</b>
  <nav class="seg"><a href="index.html">Wizard</a><a class="on" href="canvas.html">Canvas</a></nav>
  <span class="vr"></span>
  <label class="bname"><input id="bname" spellcheck="false" placeholder="Untitled board"><i data-icon="pencil"></i></label><span id="saved" class="status"></span>
  <span class="vr"></span>
  <button class="tb" id="addSource"><i data-icon="plus"></i>Source</button><button class="tb" id="addMix"><i data-icon="plus"></i>Mix</button><button class="tb" id="addTarget"><i data-icon="plus"></i>Target</button>
  <span class="grow"></span>
  <label class="seed">Seed<input id="seed" type="number" value="42"></label><button class="tb icon" id="reroll" title="New seed"><i data-icon="reroll"></i></button>
  <div class="menuwrap"><button class="tb" id="openB"><i data-icon="folder"></i>Open</button><div id="openMenu" class="menu" hidden></div></div>
  <button class="tb" id="saveB"><i data-icon="save"></i>Save</button>
</header>
<div id="stage">
  <div id="world"><svg id="wires"></svg></div>
  <div id="empty" hidden></div>
  <div id="dropMenu" class="menu" hidden></div>
  <div class="zoom"><button id="zOut" title="Zoom out"><i data-icon="minus"></i></button><span id="zPct">100%</span><button id="zIn" title="Zoom in"><i data-icon="plus"></i></button><span class="vr"></span><button id="zFit" title="Fit to screen"><i data-icon="fit"></i></button></div>
</div>
<div id="toast"></div>
<script src="canvas.js"></script></body></html>
