<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sieve DatasetConverter</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><g fill="#0f1115"><circle cx="10" cy="11" r="2"/><circle cx="16" cy="11" r="2"/><circle cx="22" cy="11" r="2"/><circle cx="13" cy="17" r="2"/><circle cx="19" cy="17" r="2"/><circle cx="16" cy="23" r="2"/></g></svg>
  <div><h1>Sieve <span>DatasetConverter</span></h1><p>Hugging Face, Parquet, CSV, JSON or DuckDB → your schema → DuckDB</p></div>
</header>

<section id="s1"><h2><b>1</b>Dataset</h2>
  <div class="row"><input id="url" class="grow" placeholder="org/name · URL · local path (.parquet .csv .json .jsonl .duckdb)">
    <select id="split" hidden></select><select id="table" hidden></select></div>
  <div class="row">
    <label>Schema<select id="schema"></select></label>
    <label>Fetch<select id="limit"><option>1000</option><option selected>10000</option><option>100000</option><option value="all">all rows</option></select></label>
    <button class="ghost" id="editBtn">Edit schemas</button><span class="grow"></span><button id="dl">Download</button></div>
  <div id="editor" hidden><textarea id="schemaJson" rows="14" spellcheck="false"></textarea>
    <div class="row"><span class="hint">Save under a new <code>name</code> to create a schema.</span><span class="grow"></span><button id="saveSchema">Save schema</button></div></div>
  <p id="info" class="hint"></p></section>

<section id="s2" class="off"><h2><b>2</b>Mapping</h2><div id="map" class="grid"></div></section>

<section id="s3" class="off"><h2><b>3</b>Metadata</h2>
  <div id="meta"></div>
  <div class="row"><button class="ghost" id="addMeta">+ Add field</button><span class="grow"></span>
    <label>Store in<select id="metaCol"></select></label><button class="ghost" id="prevBtn">Refresh preview</button></div>
  <div id="preview" class="tablewrap"></div></section>

<section id="s4" class="off"><h2><b>4</b>Sample &amp; write</h2>
  <div class="row"><label>Rows<input id="n" type="number" value="500" min="1"></label><label>Seed<input id="seed" type="number" value="42"></label>
    <label>Target<select id="target"></select></label><input id="newTarget" placeholder="new-file.duckdb" hidden>
    <span id="mode" class="badge"></span><span class="grow"></span><button id="writeBtn">Write</button></div>
  <div id="result"></div></section>
<div id="toast"></div>
</main><script src="app.js"></script></body></html>
